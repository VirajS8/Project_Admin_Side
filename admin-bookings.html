<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookings — MOCTALE Admin</title>
  <link rel="stylesheet" href="admin-style.css" />
</head>
<body>

    <!-- ADMIN NAVBAR -->
  <nav class="admin-navbar">
    <a href="admin-home.html" class="admin-nav-brand">
      <img src="unnamed.webp" alt="MOCTALE">
      MOCTALE
    </a>
    <div class="admin-nav-links">
      <a href="admin-home.html">Home</a>
      <a href="admin-dashboard.html">Dashboard</a>
      <a href="admin-movies.html">Movies</a>
      <a href="admin-theaters.html">Theaters</a>
      <a href="admin-shows.html">Shows</a>
      <a href="admin-bookings.html" class="active">Bookings</a>
    </div>
    <div class="admin-nav-actions">
      <div class="admin-avatar-wrap">
        <div class="admin-avatar-btn" onclick="toggleAdminMenu()">A</div>
        <div class="admin-dropdown" id="admin-dropdown">
          <div class="admin-dropdown-label">Admin</div>
          <div class="admin-dropdown-divider"></div>
          <button class="admin-dropdown-item" onclick="adminLogout()">🚪 Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="admin-main">
      <div class="page-header">
        <div class="page-header-left">
          <h1>Bookings</h1>
          <p>View and manage all customer bookings.</p>
        </div>
      </div>


      <!-- FILTER BAR -->
      <div style="margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <div class="filter-bar" id="filterBar">
          <button class="filter-btn active" onclick="filterBookings('all', this)">All</button>
          <button class="filter-btn" onclick="filterBookings('upcoming', this)">Upcoming</button>
          <button class="filter-btn" onclick="filterBookings('completed', this)">Completed</button>
          <button class="filter-btn" onclick="filterBookings('cancelled', this)">Cancelled</button>
        </div>
        <span id="bookingCount" style="font-size:13px;color:var(--text-muted)"></span>
      </div>

      <!-- TABLE CARD -->
      <div class="card">
        <div class="card-header">
          <h2>All Bookings</h2>
          <button class="btn btn-sm btn-ghost" onclick="refreshBookings()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            Refresh
          </button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Booking ID</th>
                <th>Movie</th>
                <th>Theater</th>
                <th>Date</th>
                <th>Time</th>
                <th>Seats</th>
                <th>Amount</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="bookingsBody"></tbody>
          </table>
        </div>
      </div>
    </main>
    </div>

  <div class="toast-wrap" id="toast-wrap"></div>

  <script>
    if (!localStorage.getItem('adminLoggedIn')) window.location.href = 'admin-login.html';

    function toggleAdminMenu() {
      document.getElementById('admin-dropdown').classList.toggle('open');
    }
    document.addEventListener('click', function(e) {
      const wrap = document.querySelector('.admin-avatar-wrap');
      if (wrap && !wrap.contains(e.target)) {
        const dd = document.getElementById('admin-dropdown');
        if (dd) dd.classList.remove('open');
      }
    });
    function adminLogout() {
      localStorage.removeItem('adminLoggedIn');
      window.location.href = 'admin-login.html';
    }

    let allBookings = [];
    let currentFilter = 'all';

    function getStatusBadge(status) {
      const s = (status || 'upcoming').toLowerCase();
      if (s === 'upcoming')   return '<span class="badge badge-success">Upcoming</span>';
      if (s === 'completed')  return '<span class="badge badge-info">Completed</span>';
      if (s === 'cancelled')  return '<span class="badge badge-danger">Cancelled</span>';
      return '<span class="badge badge-warning">' + s + '</span>';
    }

    function loadBookings() {
      try {
        allBookings = JSON.parse(localStorage.getItem('moctale_bookings') || '[]');
      } catch(e) {
        allBookings = [];
      }
    }

    function renderBookings(filter) {
      const tbody = document.getElementById('bookingsBody');
      let data = allBookings;

      if (filter && filter !== 'all') {
        data = allBookings.filter(b => (b.status || 'upcoming').toLowerCase() === filter);
      }

      document.getElementById('bookingCount').textContent = data.length + ' booking' + (data.length !== 1 ? 's' : '');

      if (data.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8">
              <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                </svg>
                <h3>No bookings yet</h3>
                <p>${filter !== 'all' ? 'No ' + filter + ' bookings found.' : 'Bookings made on the user side will appear here.'}</p>
              </div>
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = [...data].reverse().map(b => {
        const bookingId = b.id || b.bookingId || ('BK' + Math.random().toString(36).substring(2,8).toUpperCase());
        const movie     = b.movie || b.movieName || '—';
        const theater   = b.theater || b.theaterName || '—';
        const date      = b.date || '—';
        const time      = b.time || b.showTime || '—';
        const seats     = Array.isArray(b.seats) ? b.seats.join(', ') : (b.seats || '—');
        const amount    = b.amount || b.totalAmount || b.total || '—';
        const status    = b.status || 'upcoming';

        return `
          <tr>
            <td><code style="font-size:11px;color:var(--text-muted);background:var(--bg-3);padding:3px 7px;border-radius:4px">${bookingId}</code></td>
            <td><strong>${movie}</strong></td>
            <td>${theater}</td>
            <td>${date}</td>
            <td>${time}</td>
            <td style="font-size:13px">${seats}</td>
            <td><strong>₹${amount}</strong></td>
            <td>${getStatusBadge(status)}</td>
          </tr>`;
      }).join('');
    }

    function filterBookings(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderBookings(filter);
    }

    function refreshBookings() {
      loadBookings();
      renderBookings(currentFilter);
    }

    loadBookings();
    renderBookings('all');
  </script>
</body>
</html>
